name: HFA Integrated Regression

# AVISO: Este workflow executa regressão integrada com ambiente real controlado.
# NÃO usar produção. NÃO escrever em produção ou staging com dados reais de usuário.
# Habilitado apenas via workflow_dispatch até que ambiente de staging seja configurado.
#
# Dois níveis de execução:
#   READ_ONLY (padrão) — apenas testes com dataAccess=READ_ONLY ou NONE
#   MUTATING_SYNTHETIC — também executa testes com dataAccess=MUTATING_SYNTHETIC,
#                        que escrevem APENAS em fixtures explícitas de staging.
#                        Requer confirmação adicional explícita.

on:
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: "Confirma que o ambiente alvo é exclusivamente staging/dev (nunca produção)"
        required: true
        type: boolean
        default: false
      confirm_mutating_synthetic_fixture_only:
        description: >
          [OPCIONAL] Confirma que deseja executar testes MUTATING_SYNTHETIC.
          Esses testes escrevem dados sintéticos de fixture no staging.
          SÓ marque se você provisionou fixtures HFA_TEST_TENANT_A_ID/HFA_TEST_USER_A_ID.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-environment:
    name: Check Environment Availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment_available: ${{ steps.check.outputs.available }}
      run_mutating: ${{ steps.check.outputs.run_mutating }}

    steps:
      - name: Verify staging confirmation
        if: ${{ !inputs.confirm_staging_only }}
        run: |
          echo "ERROR: confirm_staging_only must be true to run integrated regression"
          echo "Este workflow NÃO pode ser executado em produção."
          exit 1

      - name: Check required secrets and project ref allowlist
        id: check
        run: |
          missing=""
          if [ -z "$SUPABASE_STAGING_URL" ]; then missing="$missing SUPABASE_STAGING_URL"; fi
          if [ -z "$SUPABASE_STAGING_SERVICE_ROLE_KEY" ]; then missing="$missing SUPABASE_STAGING_SERVICE_ROLE_KEY"; fi
          if [ -z "$SUPABASE_STAGING_ANON_KEY" ]; then missing="$missing SUPABASE_STAGING_ANON_KEY"; fi
          if [ -z "$NEXTAUTH_SECRET_STAGING" ]; then missing="$missing NEXTAUTH_SECRET_STAGING"; fi
          if [ -z "$HFA_STAGING_SUPABASE_PROJECT_REF" ]; then missing="$missing HFA_STAGING_SUPABASE_PROJECT_REF"; fi

          if [ -n "$missing" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "run_mutating=false" >> "$GITHUB_OUTPUT"
            echo "ENVIRONMENT_UNAVAILABLE: missing secrets/variables:$missing"
            echo "Status: INTEGRATED_REGRESSION_WORKFLOW_READY_ENVIRONMENT_NOT_CONFIGURED"
            echo ""
            echo "Para habilitar este workflow, configure no repositório:"
            echo "  Secrets:   SUPABASE_STAGING_URL, SUPABASE_STAGING_SERVICE_ROLE_KEY"
            echo "             SUPABASE_STAGING_ANON_KEY, NEXTAUTH_SECRET_STAGING"
            echo "  Variables: HFA_STAGING_SUPABASE_PROJECT_REF (ref do projeto Supabase staging)"
            echo ""
            echo "IMPORTANTE: usar exclusivamente ambiente dev/staging, nunca produção."
          else
            # Verify project ref matches URL
            URL_HOST=$(echo "$SUPABASE_STAGING_URL" | sed 's|https://||' | cut -d'.' -f1)
            if [ "$URL_HOST" != "$HFA_STAGING_SUPABASE_PROJECT_REF" ]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "run_mutating=false" >> "$GITHUB_OUTPUT"
              echo "ENVIRONMENT_MISCONFIGURED: SUPABASE_STAGING_URL project ref does not match HFA_STAGING_SUPABASE_PROJECT_REF"
              echo "  URL ref extracted: $URL_HOST"
              echo "  Expected ref:      $HFA_STAGING_SUPABASE_PROJECT_REF"
              echo "Refusing to run against unallowlisted Supabase project."
              exit 1
            fi

            # Verify HTTPS
            if [[ "$SUPABASE_STAGING_URL" != https://* ]]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "run_mutating=false" >> "$GITHUB_OUTPUT"
              echo "ENVIRONMENT_MISCONFIGURED: SUPABASE_STAGING_URL must use HTTPS"
              exit 1
            fi

            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "All required environment secrets found. Project ref verified."

            # Mutating level: requires confirm flag AND all 4 fixture IDs (A and B).
            # Some mutating tests are cross-tenant — both tenant pairs required.
            # If confirm_mutating_synthetic_fixture_only=true but any fixture ID is missing,
            # fail immediately — NO silent fallback to READ_ONLY to avoid false confidence.
            if [ "${{ inputs.confirm_mutating_synthetic_fixture_only }}" = "true" ]; then
              missing_fixtures=""
              if [ -z "$HFA_TEST_TENANT_A_ID" ]; then missing_fixtures="$missing_fixtures HFA_TEST_TENANT_A_ID"; fi
              if [ -z "$HFA_TEST_USER_A_ID" ]; then missing_fixtures="$missing_fixtures HFA_TEST_USER_A_ID"; fi
              if [ -z "$HFA_TEST_TENANT_B_ID" ]; then missing_fixtures="$missing_fixtures HFA_TEST_TENANT_B_ID"; fi
              if [ -z "$HFA_TEST_USER_B_ID" ]; then missing_fixtures="$missing_fixtures HFA_TEST_USER_B_ID"; fi

              if [ -n "$missing_fixtures" ]; then
                echo "available=false" >> "$GITHUB_OUTPUT"
                echo "run_mutating=false" >> "$GITHUB_OUTPUT"
                echo "ENVIRONMENT_MISCONFIGURED: confirm_mutating_synthetic_fixture_only=true but missing:$missing_fixtures"
                echo "All 4 fixture variables (A and B tenant/user pairs) are required for MUTATING_SYNTHETIC."
                echo "DO NOT fall back silently to READ_ONLY — configure fixtures before requesting mutating run."
                exit 1
              fi

              echo "run_mutating=true" >> "$GITHUB_OUTPUT"
              echo "MUTATING_SYNTHETIC level: ENABLED (all 4 fixture IDs present)"
            else
              echo "run_mutating=false" >> "$GITHUB_OUTPUT"
              echo "MUTATING_SYNTHETIC level: DISABLED (default READ_ONLY only)"
            fi
          fi
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          NEXTAUTH_SECRET_STAGING: ${{ secrets.NEXTAUTH_SECRET_STAGING }}
          HFA_STAGING_SUPABASE_PROJECT_REF: ${{ vars.HFA_STAGING_SUPABASE_PROJECT_REF }}
          HFA_TEST_TENANT_A_ID: ${{ vars.HFA_TEST_TENANT_A_ID }}
          HFA_TEST_USER_A_ID: ${{ vars.HFA_TEST_USER_A_ID }}
          HFA_TEST_TENANT_B_ID: ${{ vars.HFA_TEST_TENANT_B_ID }}
          HFA_TEST_USER_B_ID: ${{ vars.HFA_TEST_USER_B_ID }}

  integrated-regression:
    name: HFA Integrated Regression (Staging/Dev Only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-environment
    if: needs.check-environment.outputs.environment_available == 'true'

    env:
      # Ambiente de staging/dev APENAS — nunca produção
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
      SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
      SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_STAGING }}
      NEXTAUTH_URL: http://127.0.0.1:3100
      SERA_VNEXT_TEST_BASE_URL: http://127.0.0.1:3100
      # Project ref allowlist — must match SUPABASE_STAGING_URL extracted ref
      HFA_STAGING_SUPABASE_PROJECT_REF: ${{ vars.HFA_STAGING_SUPABASE_PROJECT_REF }}
      # Staging fixture IDs — set in repository variables; required for MUTATING_SYNTHETIC tests
      HFA_TEST_TENANT_A_ID: ${{ vars.HFA_TEST_TENANT_A_ID }}
      HFA_TEST_USER_A_ID: ${{ vars.HFA_TEST_USER_A_ID }}
      HFA_TEST_TENANT_B_ID: ${{ vars.HFA_TEST_TENANT_B_ID }}
      HFA_TEST_USER_B_ID: ${{ vars.HFA_TEST_USER_B_ID }}
      HFA_TEST_USER_A_EMAIL: ${{ secrets.HFA_TEST_USER_A_EMAIL }}
      HFA_TEST_USER_B_EMAIL: ${{ secrets.HFA_TEST_USER_B_EMAIL }}
      HFA_TEST_USER_A_PASSWORD: ${{ secrets.HFA_TEST_USER_A_PASSWORD }}
      HFA_TEST_USER_B_PASSWORD: ${{ secrets.HFA_TEST_USER_B_PASSWORD }}
      # Execution level — READ_ONLY or MUTATING_SYNTHETIC
      HFA_INTEGRATED_REGRESSION_LEVEL: ${{ needs.check-environment.outputs.run_mutating == 'true' && 'MUTATING_SYNTHETIC' || 'READ_ONLY' }}
      HFA_TEST_ENVIRONMENT: staging
      # SERA vNext flags: shadow always OFF. Product Beta only enabled ephemerally for MUTATING.
      SERA_VNEXT_READONLY_ENABLED: "false"
      SERA_VNEXT_INTERNAL_PILOT_ENABLED: "false"
      NEXT_PUBLIC_SERA_VNEXT_DIAGNOSTICS_ENABLED: "false"
      SERA_VNEXT_PRODUCT_BETA_ENABLED: ${{ needs.check-environment.outputs.run_mutating == 'true' && 'true' || 'false' }}
      SERA_SHADOW_EXECUTION_ENABLED: "false"
      SERA_SHADOW_PERSISTENCE_ENABLED: "false"
      SERA_SHADOW_ADMIN_VIEW_ENABLED: "false"
      SERA_SHADOW_AUTO_COMPARISON_ENABLED: "false"
      SERA_SHADOW_VALIDATION_REPORTS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Write frontend staging env file
        working-directory: frontend
        run: |
          # REAL_* readiness trials require frontend/.env.local to exist.
          # Values come from staging secrets already injected as job env — never echoed.
          umask 077
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
            echo "SUPABASE_STAGING_URL=${SUPABASE_STAGING_URL}"
            echo "SUPABASE_STAGING_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "SUPABASE_STAGING_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
            echo "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}"
            echo "NEXTAUTH_URL=${NEXTAUTH_URL}"
            echo "HFA_STAGING_SUPABASE_PROJECT_REF=${HFA_STAGING_SUPABASE_PROJECT_REF}"
            echo "HFA_TEST_ENVIRONMENT=${HFA_TEST_ENVIRONMENT}"
            echo "SERA_VNEXT_PRODUCT_BETA_ENABLED=${SERA_VNEXT_PRODUCT_BETA_ENABLED}"
            echo "SERA_SHADOW_EXECUTION_ENABLED=false"
            echo "SERA_SHADOW_PERSISTENCE_ENABLED=false"
            echo "SERA_SHADOW_ADMIN_VIEW_ENABLED=false"
            echo "SERA_SHADOW_AUTO_COMPARISON_ENABLED=false"
            echo "SERA_SHADOW_VALIDATION_REPORTS_ENABLED=false"
          } > .env.local
          test -s .env.local
          echo "frontend/.env.local written (contents not printed)"
          echo "Product Beta ephemeral flag for this job: ${SERA_VNEXT_PRODUCT_BETA_ENABLED}"
          echo "Shadow flags: all false"

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          npm start -- -p 3100 > /tmp/hfa-next.log 2>&1 &
          echo $! > /tmp/hfa-next.pid

      - name: Wait for frontend
        run: |
          ready=false
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3100 >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "LOCAL_FRONTEND_SERVER_NOT_READY"
            exit 1
          fi
          echo "Frontend ready at http://127.0.0.1:3100"

      - name: Report execution level
        run: |
          echo "Execution level: $HFA_INTEGRATED_REGRESSION_LEVEL"
          echo "MUTATING_SYNTHETIC tests: ${{ needs.check-environment.outputs.run_mutating }}"

      - name: Run integrated regression
        run: ./frontend/node_modules/.bin/tsx scripts/run-sera-vnext-regression.ts

      - name: Stop frontend
        if: always()
        run: |
          if [ -f /tmp/hfa-next.pid ]; then
            kill "$(cat /tmp/hfa-next.pid)" 2>/dev/null || true
          fi

  environment-not-configured:
    name: INTEGRATED_REGRESSION_WORKFLOW_READY_ENVIRONMENT_NOT_CONFIGURED
    runs-on: ubuntu-latest
    needs: check-environment
    if: needs.check-environment.outputs.environment_available == 'false'

    steps:
      - name: Report environment status
        run: |
          echo "======================================================="
          echo "INTEGRATED_REGRESSION_WORKFLOW_READY_ENVIRONMENT_NOT_CONFIGURED"
          echo "======================================================="
          echo ""
          echo "O workflow de regressão integrada está pronto mas o"
          echo "ambiente de staging não está configurado."
          echo ""
          echo "NÃO usar produção."
          echo "NÃO inventar credenciais."
          echo ""
          echo "Para configurar, adicione no repositório:"
          echo "  Secrets:"
          echo "    - SUPABASE_STAGING_URL"
          echo "    - SUPABASE_STAGING_SERVICE_ROLE_KEY"
          echo "    - SUPABASE_STAGING_ANON_KEY"
          echo "    - NEXTAUTH_SECRET_STAGING"
          echo "  Variables:"
          echo "    - HFA_STAGING_SUPABASE_PROJECT_REF (ref do projeto Supabase de staging)"
          echo "    - HFA_TEST_TENANT_A_ID  (para testes MUTATING_SYNTHETIC)"
          echo "    - HFA_TEST_USER_A_ID    (para testes MUTATING_SYNTHETIC)"
          echo "======================================================="
          exit 0
