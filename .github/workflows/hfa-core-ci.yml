name: HFA Core CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hfa-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: HFA Core CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      NEXTAUTH_SECRET: ci-placeholder
      NEXTAUTH_URL: http://localhost:3000
      SERA_VNEXT_READONLY_ENABLED: "false"
      SERA_VNEXT_INTERNAL_PILOT_ENABLED: "false"
      NEXT_PUBLIC_SERA_VNEXT_DIAGNOSTICS_ENABLED: "false"
      SERA_SHADOW_EXECUTION_ENABLED: "false"
      SERA_SHADOW_PERSISTENCE_ENABLED: "false"
      SERA_SHADOW_ADMIN_VIEW_ENABLED: "false"
      SERA_SHADOW_AUTO_COMPARISON_ENABLED: "false"
      SERA_SHADOW_VALIDATION_REPORTS_ENABLED: "false"
      NEXT_PUBLIC_SERA_SHADOW_ADMIN_VIEW_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production dependency vulnerability gate
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Development tooling vulnerability gate
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Signup WAF 429 UI contract
        working-directory: frontend
        run: ./node_modules/.bin/tsx --test tests/api-rate-limit-response.test.ts

      - name: Supabase direct signup policy audit contract
        working-directory: frontend
        run: node --test tests/auth-public-signup-policy.test.mjs

      - name: Two-tenant read-only E2E fixture contract
        working-directory: frontend
        run: node --test tests/two-tenant-readonly-e2e.test.mjs

      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Registration consistency and cleanup
        run: ./frontend/node_modules/.bin/tsx --test frontend/tests/register-compensating-rollback.test.ts

      - name: Canonical signup routing with legacy API configured
        env:
          NEXT_PUBLIC_API_URL: https://legacy-not-trusted.example
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/gemini-tenancy-security/test-canonical-signup-routing.ts

      - name: ERC containment runtime
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/erc-containment/erc-containment-trial-001.ts

      - name: ERC containment static
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/erc-containment/erc-containment-trial-002-static.ts

      - name: ERC containment D3-b
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/erc-containment/erc-containment-trial-003-d3b.ts

      - name: Legacy freeze
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/legacy-freeze/legacy-freeze-trial-001.ts

      - name: Shadow mode
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/shadow-mode/shadow-mode-trial-001.ts

      - name: Shadow divergence V1 contract
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/shadow-mode/shadow-mode-trial-002-comparison.ts

      - name: Shadow rollback contract
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/shadow-mode/shadow-mode-trial-003-rollback.ts

      - name: Shadow production build interlock (adversarial)
        working-directory: frontend
        run: node --test tests/shadow-prod-prebuild-guard.test.mjs

      - name: Tenant isolation contract
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/tenant-isolation/tenant-isolation-contract-trial-001.ts

      - name: Platform admin and staging target fail-closed contract
        run: |
          ./frontend/node_modules/.bin/tsx tests/hfa-audit/gemini-tenancy-security/test-platform-admin-remediation.ts
          ./frontend/node_modules/.bin/tsx tests/hfa-audit/gemini-release-readiness/staging-smoke-synthetic-plan.ts

      - name: Python backend DB-authoritative tenant boundary
        run: |
          python3 -m unittest discover -s backend/tests -p 'test_authoritative_user.py' -v
          python3 -m unittest discover -s backend/tests -p 'test_legacy_routes_hardening.py' -v
          ./frontend/node_modules/.bin/tsx tests/hfa-audit/gemini-tenancy-security/test-python-authoritative-tenant-boundary.ts

      - name: Setup Python 3.12 for FastAPI runtime security contract
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned FastAPI runtime contract dependencies
        run: |
          python3 -m pip install --disable-pip-version-check             fastapi==0.111.0             supabase==2.4.6             pydantic-settings==2.2.1             httpx==0.27.0             email-validator==2.2.0

      - name: FastAPI actual HTTP routing security contracts (offline)
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: synthetic-anon
          SUPABASE_SERVICE_ROLE_KEY: synthetic-service
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s backend/tests -p 'test_fastapi_route_runtime_v24.py' -v

      - name: AI credentials request scope and concurrency isolation
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/gemini-tenancy-security/test-ai-request-scope-trial-001.ts

      - name: Hard delete cross-tenant lifecycle audit guard
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/gemini-tenancy-security/test-hard-delete-tenant-ownership.ts


      - name: Commercial trial contract
        run: ./frontend/node_modules/.bin/tsx tests/product/test-trial-usage.ts

      - name: Safety event workflow contract
        run: ./frontend/node_modules/.bin/tsx tests/product/test-safety-event-workflow.ts
