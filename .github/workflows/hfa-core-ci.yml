name: HFA Core CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hfa-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: HFA Core CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      NEXTAUTH_SECRET: ci-placeholder
      NEXTAUTH_URL: http://localhost:3000
      SERA_VNEXT_READONLY_ENABLED: "false"
      SERA_VNEXT_INTERNAL_PILOT_ENABLED: "false"
      NEXT_PUBLIC_SERA_VNEXT_DIAGNOSTICS_ENABLED: "false"
      SERA_SHADOW_EXECUTION_ENABLED: "false"
      SERA_SHADOW_PERSISTENCE_ENABLED: "false"
      SERA_SHADOW_ADMIN_VIEW_ENABLED: "false"
      SERA_SHADOW_AUTO_COMPARISON_ENABLED: "false"
      SERA_SHADOW_VALIDATION_REPORTS_ENABLED: "false"
      NEXT_PUBLIC_SERA_SHADOW_ADMIN_VIEW_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production dependency vulnerability gate
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Development tooling vulnerability gate
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Signup WAF 429 UI contract
        working-directory: frontend
        run: ./node_modules/.bin/tsx --test tests/api-rate-limit-response.test.ts

      - name: Supabase direct signup policy audit contract
        working-directory: frontend
        run: node --test tests/auth-public-signup-policy.test.mjs

      - name: OAuth bootstrap tenant admission regression
        working-directory: frontend
        run: node --test tests/oauth-bootstrap-admission.test.mjs

      - name: Two-tenant read-only E2E fixture contract
        working-directory: frontend
        run: node --test tests/two-tenant-readonly-e2e.test.mjs

      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Original source preview authorization, hash and quota contract
        run: ./frontend/node_modules/.bin/tsx --test frontend/tests/event-source-preview.test.ts

      - name: Actual PDF and DOCX text parser regression with synthetic originals
        run: ./frontend/node_modules/.bin/tsx --test frontend/tests/event-source-preview-real-parsers.test.ts

      - name: Original source preview privacy and no-scientific-mutation contract
        working-directory: frontend
        run: node --test tests/event-source-preview-contract.test.mjs

      - name: Event append, concurrency, idempotency and byte-range tests
        run: ./frontend/node_modules/.bin/tsx --test frontend/tests/event-document-append.test.ts

      - name: Event append API and scientific non-mutation contract
        working-directory: frontend
        run: node --test tests/event-document-append-contract.test.mjs

      - name: Event document least-privilege SQL security
        working-directory: frontend
        run: node --test tests/event-document-least-privilege-sql.test.mjs

      - name: Event document provenance and private read-only access
        run: ./frontend/node_modules/.bin/tsx --test frontend/tests/event-document-provenance.test.ts

      - name: Event document source provenance SQL and API contract
        working-directory: frontend
        run: node --test tests/event-document-provenance-contract.test.mjs

      - name: Event attachment persistence, compensation and request bounds
        run: ./frontend/node_modules/.bin/tsx --test frontend/tests/event-attachment-integrity.test.ts

      - name: Event attachment fail-closed route contract
        working-directory: frontend
        run: node --test tests/event-attachment-route-contract.test.mjs

      - name: Document extraction quota security contract
        working-directory: frontend
        run: node --test tests/document-extraction-quota-sql-contract.test.mjs

      - name: Document extraction body and quota tests
        run: ./frontend/node_modules/.bin/tsx --test frontend/tests/document-extraction-gate.test.ts

      - name: Distributed signup SQL security contract
        working-directory: frontend
        run: node --test tests/registration-distributed-sql-contract.test.mjs

      - name: Registration admission, challenge and rollback
        run: ./frontend/node_modules/.bin/tsx --test frontend/tests/register-compensating-rollback.test.ts frontend/tests/registration-turnstile.test.ts frontend/tests/registration-hosted-auth-policy.test.ts frontend/tests/registration-distributed-limit.test.ts

      - name: ERC containment runtime
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/erc-containment/erc-containment-trial-001.ts

      - name: ERC containment static
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/erc-containment/erc-containment-trial-002-static.ts

      - name: ERC containment D3-b
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/erc-containment/erc-containment-trial-003-d3b.ts

      - name: Legacy freeze
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/legacy-freeze/legacy-freeze-trial-001.ts

      - name: Shadow mode
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/shadow-mode/shadow-mode-trial-001.ts

      - name: Shadow divergence V1 contract
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/shadow-mode/shadow-mode-trial-002-comparison.ts

      - name: Shadow rollback contract
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/shadow-mode/shadow-mode-trial-003-rollback.ts

      - name: Shadow production build interlock (adversarial)
        working-directory: frontend
        run: node --test tests/shadow-prod-prebuild-guard.test.mjs

      - name: Tenant isolation contract
        run: ./frontend/node_modules/.bin/tsx tests/hfa-audit/tenant-isolation/tenant-isolation-contract-trial-001.ts


      - name: Commercial trial contract
        run: ./frontend/node_modules/.bin/tsx tests/product/test-trial-usage.ts

      - name: Safety event workflow contract
        run: ./frontend/node_modules/.bin/tsx tests/product/test-safety-event-workflow.ts
